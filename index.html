<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BON - 3D Spiral Universe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #030712; color: #f8fafc; overflow: hidden; margin: 0; }
        
        .space-bg {
            background: radial-gradient(circle at 50% 40%, #0f172a 0%, #030712 100%);
        }

        /* Container xoắn ốc 3D */
        .scene {
            width: 100vw;
            height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            overflow: hidden;
            touch-action: none;
        }

        .spiral-track {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        /* Thẻ sách dọc theo đường xoắn ốc */
        .book-item {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 240px;
            height: 320px;
            margin-left: -120px;
            margin-top: -160px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            cursor: pointer;
            transition: border-color 0.3s;
            user-select: none;
        }

        .book-item:hover {
            border-color: rgba(16, 185, 129, 0.8);
            box-shadow: 0 25px 50px rgba(16, 185, 129, 0.3);
        }

        .neon-glow {
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }
    </style>
</head>
<body class="space-bg min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <header class="sticky top-0 z-50 px-6 py-4 flex justify-between items-center bg-black/60 backdrop-blur-xl border-b border-white/10">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
            <h1 class="text-xs md:text-sm font-bold tracking-widest text-emerald-400">BON</h1>
        </div>
        <nav class="space-x-4 text-xs font-semibold text-slate-300">
            <a href="#" class="text-emerald-400">3D Spiral</a>
            <a href="#" class="hover:text-emerald-400 transition">Từ Vựng</a>
            <a href="#" class="hover:text-emerald-400 transition">Admin</a>
        </nav>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center text-center relative">
        
        <div class="absolute top-4 z-10">
            <div class="inline-block bg-emerald-500/10 text-emerald-400 text-[11px] font-bold px-4 py-1.5 rounded-full border border-emerald-500/30 shadow-[0_0_20px_rgba(16,185,129,0.3)] tracking-wider uppercase">
                🌀 Vuốt ngang màn hình để xoay trục 3D
            </div>
            <h2 class="text-2xl md:text-4xl font-extrabold tracking-tight mt-2 text-white neon-glow">
                Vũ Trụ Xoắn Ốc Hán Ngữ
            </h2>
        </div>

        <div class="scene" id="scene">
            <div class="spiral-track" id="spiralTrack">
                </div>
        </div>
    </main>

    <footer class="text-center py-4 text-[11px] text-slate-500 border-t border-white/5 bg-black/40 z-10">
        &copy; 2026 BON. 3D Spiral Interactive Universe.
    </footer>

    <script>
        const books = [
            { id: 1, title: "Hán Ngữ Quyển 1", desc: "Nhập môn & Pinyin cơ bản", lessons: "15 Bài" },
            { id: 2, title: "Hán Ngữ Quyển 2", desc: "Ngữ pháp sơ cấp mở rộng", lessons: "15 Bài" },
            { id: 3, title: "Hán Ngữ Quyển 3", desc: "Trung cấp cơ sở, HSK 3", lessons: "20 Bài" },
            { id: 4, title: "Hán Ngữ Quyển 4", desc: "Trung cấp chuyên sâu", lessons: "20 Bài" },
            { id: 5, title: "Hán Ngữ Quyển 5", desc: "Cao cấp thương mại", lessons: "26 Bài" },
            { id: 6, title: "Hán Ngữ Quyển 6", desc: "Hoàn thiện đỉnh cao HSK", lessons: "26 Bài" }
        ];

        const track = document.getElementById('spiralTrack');
        let currentAngle = 0;
        let targetAngle = 0;

        // Khởi tạo các thẻ sách lên đường xoắn ốc 3D
        function renderBooks() {
            track.innerHTML = '';
            const total = books.length;
            books.forEach((book, index) => {
                const angle = (index / total) * Math.PI * 2;
                
                const card = document.createElement('div');
                card.className = 'book-item';
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-3xl font-black text-emerald-400">0${book.id}</span>
                        <span class="text-[10px] bg-white/10 px-2.5 py-1 rounded-full text-slate-300 font-medium">${book.lessons}</span>
                    </div>
                    <div class="text-left my-auto">
                        <h3 class="font-bold text-lg text-white mb-1">${book.title}</h3>
                        <p class="text-xs text-slate-400 leading-relaxed">${book.desc}</p>
                    </div>
                    <div class="text-center pt-2 border-t border-white/10">
                        <span class="text-xs font-semibold text-emerald-400">Chạm để mở học →</span>
                    </div>
                `;
                card.onclick = () => {
                    alert('🚀 Đang mở không gian học tập: ' + book.title + '\nHệ thống sẽ hiển thị Bài khóa, Từ mới, Luyện viết & AI Tutor.');
                };
                
                card.dataset.angle = angle;
                track.appendChild(card);
            });
            updateSpiralPositions();
        }

        // Tính toán tọa độ xoắn ốc 3D theo góc quay
        function updateSpiralPositions() {
            const items = track.querySelectorAll('.book-item');
            const radiusX = window.innerWidth < 768 ? 140 : 320;
            const radiusZ = window.innerWidth < 768 ? 120 : 280;

            items.forEach((item, index) => {
                const baseAngle = parseFloat(item.dataset.angle);
                const angle = baseAngle + currentAngle;
                
                // Tọa độ hình trụ/xoắn ốc 3D
                const x = Math.cos(angle) * radiusX;
                const z = Math.sin(angle) * radiusZ;
                const y = Math.sin(angle * 1.5) * 40; // Độ uốn cong lượn sóng

                // Làm mờ và thu nhỏ các quyển ở phía sau (độ sâu 3D)
                const scale = (z + radiusZ + 200) / (radiusZ * 2 + 200);
                const opacity = Math.max(0.3, scale);
                const zIndex = Math.round(scale * 100);

                item.style.transform = `translate3d(${x}px, ${y}px, ${z}px) scale(${scale})`;
                item.style.opacity = opacity;
                item.style.zIndex = zIndex;
            });
        }

        // Hiệu ứng mượt mà (Lerp)
        function animate() {
            currentAngle += (targetAngle - currentAngle) * 0.1;
            updateSpiralPositions();
            requestAnimationFrame(animate);
        }

        // Xử lý sự kiện vuốt cảm ứng trên điện thoại hoặc kéo chuột
        let isDragging = false;
        let startX = 0;

        const scene = document.getElementById('scene');

        scene.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
        });

        scene.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - startX;
            targetAngle += deltaX * 0.005;
            startX = e.touches[0].clientX;
        });

        scene.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Hỗ trợ cả máy tính (Chuột kéo)
        scene.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            targetAngle += deltaX * 0.005;
            startX = e.clientX;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Chạy khởi tạo
        renderBooks();
        animate();

        // Tự động xoay nhẹ nhàng khi không chạm vào
        setInterval(() => {
            if (!isDragging) {
                targetAngle += 0.002;
            }
        }, 30);
    </script>
</body>
</html>
